name: Firmware build

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  xiao-esp32c6:
    name: xiao-esp32c6 (core ${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "3.0.7"
            platforms: |
              - name: esp32:esp32
                version: 3.0.7
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - core: "3.1.3"
            platforms: |
              - name: esp32:esp32
                version: 3.1.3
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - core: "3.2.1"
            platforms: |
              - name: esp32:esp32
                version: 3.2.1
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - core: "3.3.0"
            platforms: |
              - name: esp32:esp32
                version: 3.3.0
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - core: latest
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:XIAO_ESP32C6
          platforms: ${{ matrix.platforms }}
          libraries: |
            - name: ArduinoJson
          sketch-paths: |
            - firmware/xiao_c6_water_meter
          enable-warnings-report: true

  atoms3r-gateway:
    name: atoms3r (core latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:m5stack_atoms3
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: ArduinoJson
            - name: M5Unified
          sketch-paths: |
            - firmware/atoms3r_water_meter
          enable-warnings-report: true
